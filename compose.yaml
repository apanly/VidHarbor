services:
  app:
    image: vidharbor:v0.2
    build:
      context: .
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      DATABASE_PATH: /data/vidharbor.db
      DOWNLOADS_MOUNT_PATH: /downloads
    volumes:
      - vidharbor-data:/data
      - vidharbor-downloads:/downloads

volumes:
  vidharbor-data:
  vidharbor-downloads:
